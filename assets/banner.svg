<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Text & Foreground Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.02); }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(5px); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(8px) translateX(-6px); }
      }
      @keyframes dashLine {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barGrow {
        0%, 100% { height: 40px; y: 220px; }
        50% { height: 70px; y: 190px; }
      }

      .animated-grid { animation: pulseGrid 6s ease-in-out infinite; transform-origin: center; }
      .node-1 { animation: floatNode1 4s ease-in-out infinite; }
      .node-2 { animation: floatNode2 5s ease-in-out infinite; }
      .pulse-line { stroke-dasharray: 8 6; animation: dashLine 12s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Background Grid & Geospatial Radar Lines (Background Layer) -->
  <g class="animated-grid">
    <!-- Isometric/Hex Grid Overlay -->
    <path d="M0,60 L1000,60 M0,120 L1000,120 M0,180 L1000,180 M0,240 L1000,240 M0,300 L1000,300" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M150,0 L150,360 M300,0 L300,360 M450,0 L450,360 M600,0 L600,360 M750,0 L750,360 M900,0 L900,360" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="820" cy="180" r="130" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4"/>
    <circle cx="820" cy="180" r="80" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.2"/>
  </g>

  <!-- Dynamic Background Floating Geospatial Nodes (Behind Text) -->
  <g class="node-1">
    <path d="M 720 140 L 780 90 L 860 120 L 890 200 L 810 240 Z" fill="url(#glowGrad)" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
    <circle cx="780" cy="90" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="860" cy="120" r="5" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="810" cy="240" r="5" fill="#a855f7" filter="url(#glow)"/>
  </g>

  <g class="node-2">
    <!-- Animated Chart Lines in Background -->
    <path class="pulse-line" d="M 680 260 Q 750 200 820 220 T 940 130" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.6"/>
  </g>

  <!-- Foreground Title Card Overlay with Backdrop Fill (Ensures foreground text is 100% visible & legible) -->
  <rect x="50" y="45" width="900" height="270" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Decorative Accent Bar -->
  <rect x="50" y="45" width="900" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Foreground Badge Pills -->
  <g stroke="#6366f1" stroke-width="1">
    <rect x="80" y="75" width="130" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9"/>
    <text x="145" y="93" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🗺️ TERRITORY DESIGN</text>

    <rect x="225" y="75" width="130" height="28" rx="14" fill="#31103f" fill-opacity="0.9"/>
    <text x="290" y="93" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 QUOTA MODELING</text>

    <rect x="370" y="75" width="125" height="28" rx="14" fill="#0c4a6e" fill-opacity="0.9"/>
    <text x="432" y="93" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ REVOPS ENGINES</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="155" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Sales Territory &amp; Quota Planning
  </text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400">
    Curated SaaS Platforms, Geospatial Engines, Quota Calculators &amp; Open-Source Tools
  </text>

  <!-- Visual Feature Highlights Row inside Card -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
    <rect x="80" y="235" width="240" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="264" fill="#e2e8f0">🏢 Enterprise SPM &amp; SaaS</text>

    <rect x="340" y="235" width="240" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="360" y="264" fill="#e2e8f0">🌐 Geospatial &amp; Map Planning</text>

    <rect x="600" y="235" width="240" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="620" y="264" fill="#e2e8f0">🚀 Self-Hosted Open-Source</text>
  </g>

</svg>
